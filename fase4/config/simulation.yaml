# Parametros da missao fase4 — perfil: simulation
#
# Estes valores sobrescrevem os padroes do codigo. Trocar de simulacao para
# voo real deve ser trocar de arquivo aqui, nunca editar o .cpp.
fase4_node:
  ros__parameters:
    # Decolagem (NED: altura negativa e para cima)
    # A ALTURA DE VOO TEM DE FICAR ABAIXO DA PAREDE.
    #
    # O padrao do gerador era -2.5 m. As paredes do labirinto tem pouco mais de
    # um metro: a 2,5 m o LIDAR passa POR CIMA delas e nao ve cômodo nenhum --
    # e a fase inteira depende de ver o cômodo.
    #
    # O sim2d NAO pega este erro: ele e 2D e ignora a altitude, entao o scan
    # sai igual a qualquer altura. Foi preciso olhar o mundo do Gazebo (paredes
    # de 1,5 m por suposicao) para o problema aparecer. E uma limitacao do
    # simulador que vale lembrar: ele responde sobre navegacao no plano, e nada
    # sobre nada fora dele.
    takeoff_height: -1.00
    max_vertical_velocity: 1.2
    position_tolerance: 0.15

    # Pouso
    landing_velocity_max: 0.5
    landing_velocity_min: 0.15
    # FRD: para cima e NEGATIVO. Estava 0.5 (positivo), que o stdstates
    # aceita mas com aviso no log a cada pouso -- ver landing/estrategia.hpp.
    max_base_height: -0.5
    landing_timeout: 5.0

    # ===== Abordagem de pouso =====
    #
    # `exponencial` (padrao) -- v(t) = v_max·e^(-t/tau), com tau derivado das
    #                alturas e velocidades acima. Nada de numero magico.
    # `s_curve`    -- perfil em S: sai de v_max e chega a v_min com derivada
    #                nula nas duas pontas. Sem o degrau de aceleracao do
    #                primeiro tick, que numa camera apontada para baixo aparece
    #                como a base saindo e voltando ao quadro.
    # `px4`        -- o modo LAND do firmware. Usa o detector de solo do PX4,
    #                que enxerga o que a missao nao enxerga (vento, empuxo
    #                caindo ao encostar). MAS tira o drone de offboard, DESARMA,
    #                e ignora os landing_velocity_* acima.
    #
    # Trocar aqui nao exige recompilar. Ver stdstates/landing/registro.hpp.
    landing_mode: 'exponencial'

    # ===== Politica de movimento =====
    #
    # COMO o drone vai de um ponto a outro.
    #
    # `holonomica` (padrao) -- linha reta ate o destino, inclusive de lado.
    # `axial`      -- gira parado ate apontar para o destino, SO ENTAO avanca.
    #                 Nunca comanda deslocamento lateral.
    #
    # Se a regra da prova mudar para "so pode girar e ir para frente", a
    # resposta e trocar esta linha -- e mais nada. Vale para os estados de
    # navegacao (waypoints, ida a um ponto, retorno); o alinhamento fino sobre
    # a base continua corrigindo de lado de proposito, porque girar a cada
    # correcao de centimetros destruiria o alinhamento.
    motion_policy: 'holonomica'

    # Movimento horizontal
    max_horizontal_velocity: 1.5

    # ── O labirinto ────────────────────────────────────────────────────────
    #
    # A planta e a rota vem deste arquivo, o MESMO que o sim2d le.
    mapa: "cbr2026_fase4.yaml"

    # Onde o drone decola, EM COORDENADAS DO MAPA. Daqui sai o vies inicial da
    # odometria: o Takeoff reancora o referencial, entao a odometria le zero
    # aqui. Comecar com vies zero mandaria o drone para o canto da arena.
    inicio_x: 4.175         # alinhado com a janela de entrada
    inicio_y: -0.600        # do lado de fora
    inicio_yaw: 1.5707963   # apontado para o leste, para dentro

    # ── Geometria das manobras ─────────────────────────────────────────────
    #
    # ATENCAO ao recuo: com comodos de 0.95 m, um drone de 0.40 m parado a
    # 0.35 m de uma parede esta a 0.40 m da oposta. Aumentar isto poe o ponto
    # de aproximacao FORA do comodo -- o test_tree tem um teste so para isso.
    recuo_da_janela: 0.35
    avanco_apos_janela: 0.35
    # NAO e a position_tolerance (que vale para decolagem e pouso): 15 cm de
    # folga num comodo de 95 cm deixa o drone parar dentro do vao da janela.
    tolerancia_movimento: 0.06
    tolerancia_centro: 0.08
    yaw_tolerance: 0.05
    ciclos_estaveis: 5.0

    # ── Ajuste de scan (maze_geometry/scan_fit.hpp) ────────────────────────

    # ONDE O LIDAR ESTA, em relacao ao centro do drone (metros, para a frente).
    #
    # O ajuste de scan devolve a posicao do SENSOR, e nao a do drone. No
    # x500_lidar_2d o LIDAR fica 12 cm a frente -- MEDIDO no Gazebo, comparando
    # o alcance para a frente com a planta: previsto 1.525 m do centro, lido
    # 1.404 m.
    #
    # Doze centimetros num labirinto de folgas de dez e erro sistematico maior
    # que a margem, e sempre na direcao da proa: o drone pararia atras do centro
    # de cada comodo, mais perto da parede que acabou de atravessar.
    #
    # O sim2d NAO pega isso: la o LIDAR esta no centro por construcao. Por isso
    # o valor e 0.0 na simulacao 2D e 0.121 no Gazebo e no voo.
    lidar_offset_frente: 0.0

    lidar_alcance_max: 8.0
    scan_salto_max: 0.15     # maior que o ruido, menor que a menor quina
    scan_tolerancia: 0.03
    scan_parede_min: 0.20

# O system_health do drone_lib tambem le deste arquivo.
system_health:
  ros__parameters:
    publish_rate: 1.0
