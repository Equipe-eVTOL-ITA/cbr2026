# Parametros da missao fase3 — perfil: SIMULACAO

fase3_node:
  ros__parameters:
    # ===== Casa ficticia (FRD: z negativo e para cima) =====
    fictual_home_x: 0.0
    fictual_home_y: 0.0
    fictual_home_z: -0.6

    # ===== Decolagem =====
    takeoff_height: -1.2

    # ===== Abordagem de decolagem =====
    # stdtakeoff (padrao) -- sobe por setpoint, em OFFBOARD, ate o
    #                        takeoff_height acima.
    # px4                 -- AUTO_TAKEOFF do firmware. Sobe ate o
    #                        MIS_TAKEOFF_ALT do PX4 e IGNORA o takeoff_height;
    #                        sai de offboard, e o estado reentra ao terminar.
    takeoff_mode: 'stdtakeoff'
    max_vertical_velocity: 1.0
    position_tolerance: 0.15

    # ===== Pouso =====
    landing_velocity_max: 0.5
    landing_velocity_min: 0.2
    max_base_height: -0.2

    # ===== Abordagem de pouso =====
    # exponencial (padrao)
    # s_curve (sem degrau de aceleracao)
    # px4 (modo LAND do firmware: tira de offboard, DESARMA, ignora as landing_velocity_* acima).
    landing_mode: 'px4'

    # ===== Politica de movimento =====
    # holonomica (padrao) -- linha reta, inclusive de lado.
    # axial               -- gira parado, so entao avanca; nunca de lado.
    # Vale para os estados de navegacao; o alinhamento fino sobre a base
    # continua corrigindo de lado de proposito.
    motion_policy: 'holonomica'

    # ===== Retorno e desarme =====
    return_home_timeout: 30.0
    disarm_grace: 3.0
    disarm_timeout: 20.0

    # ===== Busca da mao =====
    yaw_speed: 0.35
    search_yaw_range: 0.0 # desligado # 1.0472 # 60 graus
    search_confirm_cycles: 5.0

    # ===== Controle por gestos =====
    control_speed: 0.4
    max_horizontal_velocity: 1.0
    # Segundos sem posicao de mao antes de voltar a procurar.
    detection_timeout: 3.0
    # Ciclos consecutivos para aceitar POUSAR ou VOLTAR PARA CASA.
    command_confirm_cycles: 10.0

    # ===== Rastreio por guinada =====
    # DESLIGADO (0.0). O drone mantem o rumo enquanto obedece aos gestos.
    #
    # LIGADO (1.0), o drone gira para manter a mao em x=0.5
    yaw_tracking: 1.0

    # ===== Rastreio em altura =====
    # DESLIGADO (0.0). A altitude é um SETPOINT DE POSICAO
    #
    # LIGADO (1.0), move a REFERENCIA z_ref, nao mandando
    # velocidade. O teto da correcao e max_vertical_velocity.
    climb_tracking: 1.0

    # ===== PID de guinada (so tem efeito com yaw_tracking: 1.0) =====
    yaw_pid_kp: 0.6
    yaw_pid_ki: 0.0
    yaw_pid_kd: 0.06

    # ===== PID de altitude (mantem a mao centrada em y) =====
    climb_pid_kp: 0.9
    climb_pid_ki: 0.0
    climb_pid_kd: 0.09

# ===========================================================================
# No de visao da missao
# ===========================================================================
fase3_gesture:
  ros__parameters:
    gesture_topic: '/gesture_detector/gestures'
    hand_topic: '/gesture_detector/hand_location'

    # Qual mao manda.
    controlling_hand: 0

# ===========================================================================
# Reconhecimento de gestos
# ===========================================================================
gesture_detector:
  ros__parameters:
    # [SIM] Webcam local publicando no lugar da camera do drone.
    image_topic: '/frontal_camera/compressed'

    num_hands: 2

    # [SIM] Frequencia alta: tudo roda numa maquina so, sem rede no meio.
    processing_frequency: 15.0

    min_hand_detection_confidence: 0.5
    min_hand_presence_confidence: 0.5
    min_tracking_confidence: 0.5

    # Debounce interno do detector
    gesture_debounce: 5

    # [SIM] Debug ligado: aqui ha tela e ninguem esta voando de verdade.
    debug_image: true
    debug_mask: false
    debug_publish_rate: 5.0
    debug_max_width: 480
    debug_jpeg_quality: 70

# ===========================================================================
# Camera
# ===========================================================================
webcam_publisher:
  ros__parameters:
    # O webcam_publisher publica em `<camera_name>_camera/compressed`
    #
    # O `image_topic` do gesture_detector acima TEM de casar com o que sai daqui
    camera_name: 'frontal'
    use_compressed: true
    video_source: '/dev/video0'

    # QUADRADO. O recorte central para quadrado e incondicional no
    # webcam_publisher, entao 640x480 aqui pegava o recorte de 480x480 e o
    # esticava 1,33x na horizontal antes de publicar. Para gesto isso nao
    # causava erro visivel, so deformava a mao; agora o no recusa a combinacao
    # na subida em vez de aceitar em silencio.
    frame_width: 640
    frame_height: 640
    publish_rate: 15.0
    jpeg_quality: 70

    horizontal_flip: true
    vertical_flip: false

# O system_health do drone_lib tambem le deste arquivo.
system_health:
  ros__parameters:
    publish_rate: 1.0
