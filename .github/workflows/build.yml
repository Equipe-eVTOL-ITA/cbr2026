# =============================================================================
# CI — compila este repositório contra o workspace pinado, nos dois distros.
# =============================================================================
#
# Por que existe: sem CI, "a main compila" é uma crença, não um fato. E o time
# voa com DUAS distros ao mesmo tempo — Jetson (Humble) e Raspberry Pi (Jazzy),
# às vezes na mesma competição. Uma biblioteca compartilhada que vira
# Humble-only não dá nenhum sinal até alguém tentar usá-la na outra máquina,
# normalmente no pior momento possível.
#
# As versões das dependências vêm do `evtol.repos` do evtol-dev, não de uma
# lista aqui. Assim o CI responde à pergunta certa: "este repositório funciona
# com o workspace que o time realmente usa?" — e um pin bumpado lá que quebre
# aqui aparece como falha aqui.
# =============================================================================

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sem variável de pacote: os pacotes deste repositório são descobertos com
# `colcon list`. Assim o mesmo arquivo serve a repositórios de um pacote só
# (drone_lib, stdstates) e a repositórios com vários (fsm, cv_nodes).

jobs:
  build:
    name: build (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}-ros-base

    strategy:
      fail-fast: false
      matrix:
        # Os dois são obrigatórios. O primeiro run do CI comprovou que a stack
        # (px4_msgs + custom_msgs + drone_lib) compila em Jazzy — era a maior
        # incógnita do workspace, já que o time voa com Jetson (Humble) e
        # Raspberry Pi (Jazzy) na mesma competição.
        distro:
          - humble   # Jetson Orin Nano + máquina de desenvolvimento
          - jazzy    # Raspberry Pi

    steps:
      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3-vcstool python3-colcon-common-extensions python3-yaml

      - name: Clonar este repositório em src/
        uses: actions/checkout@v4
        with:
          path: src/${{ github.event.repository.name }}

      # Pela API, e não pelo raw.githubusercontent: aquele passa por CDN e serve
      # cópia velha por alguns minutos. Quem acrescenta um pacote ao manifesto e
      # re-roda este CI em seguida recebe o manifesto ANTIGO -- e o sintoma é o
      # pacote novo faltando no `vcs import`, seguido de um erro de rosdep e de
      # um erro de CMake noutro pacote. Aconteceu, e custou uma rodada.
      #
      # A lista impressa abaixo torna isso verificável num relance, em vez de
      # dedutível a partir de três erros que não mencionam o manifesto.
      - name: Buscar o manifesto do workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o evtol.repos \
            -H "Accept: application/vnd.github.raw" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Equipe-eVTOL-ITA/evtol-dev/contents/evtol.repos?ref=main"
          echo "Pacotes no manifesto:"
          python3 -c "import yaml;print(' ', ', '.join(sorted(yaml.safe_load(open('evtol.repos'))['repositories'])))"

      - name: Importar dependências nas versões pinadas
        run: |
          # Remove a própria entrada: este repositório vem do checkout acima,
          # na revisão do PR — não da tag pinada.
          python3 - <<'PY'
          import yaml
          m = yaml.safe_load(open("evtol.repos"))
          m["repositories"].pop("${{ github.event.repository.name }}", None)
          yaml.safe_dump(m, open("deps.repos", "w"))
          PY
          vcs import --shallow src < deps.repos

      # -----------------------------------------------------------------------
      # O rosdep continua NÃO sendo bloqueante -- ele erra por conta própria com
      # frequência, e travar o CI nisso custaria mais do que resolve.
      #
      # Mas ele para no primeiro problema. Uma única chave que não resolve faz
      # com que NENHUMA dependência de apt seja instalada, e o `|| echo` mandava
      # isso para o build sem dizer o que tinha faltado. O sintoma era um erro
      # de CMake três passos adiante, em outro pacote:
      #
      #     Could NOT find ZeroMQ (missing: ZeroMQ_LIBRARIES ...)
      #
      # Nada ali aponta para a causa, que era um pacote do workspace ausente do
      # manifesto. Aqui o log passa a nomear as chaves que faltaram, no lugar
      # onde o problema realmente aconteceu.
      # -----------------------------------------------------------------------
      - name: rosdep
        # `shell: bash` porque o padrao dos passos é `sh -e`, e o `sh` do
        # Ubuntu é o dash, que NÃO tem `set -o pipefail`. Sem esta linha o
        # subshell abaixo morre na primeira instrução, o `if !` vira verdadeiro
        # por motivo errado, e nada do diagnóstico aparece. Também descoberto
        # pelo CI, depois de eu já ter "corrigido" este passo duas vezes.
        shell: bash
        run: |
          rosdep update --rosdistro ${{ matrix.distro }}

          # `set -o pipefail` num subshell, e nao `if ! cmd | tee`: num
          # pipeline o status testado e o do ULTIMO comando, e o `tee` nunca
          # falha. Sem isto a condicao nunca dispara e o passo volta a ser
          # exatamente o que era -- escrevi assim na primeira tentativa e o CI
          # provou.
          if ! ( set -o pipefail
                 rosdep install --from-paths src --ignore-src -y \
                   --rosdistro ${{ matrix.distro }} 2>&1 | tee rosdep.log ); then
            faltando=$(grep -oP "Cannot locate rosdep definition for \[\K[^]]+" \
                       rosdep.log | sort -u | tr '\n' ' ')
            if [ -n "$faltando" ]; then
              echo "::error::rosdep parou: chave(s) sem definicao: $faltando."
              echo "::error::O rosdep para na PRIMEIRA falha, entao NENHUMA"
              echo "::error::dependencia de apt foi instalada. Se isto for um"
              echo "::error::pacote do workspace, ele falta no evtol.repos do"
              echo "::error::evtol-dev -- o CI busca o manifesto do main de la."
            else
              echo "::warning::rosdep reportou erros; seguindo para o build"
            fi
          fi

      - name: Compilar
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          pkgs=$(colcon list --names-only --base-paths "src/${{ github.event.repository.name }}" | tr '\n' ' ')
          echo "Pacotes deste repositório: $pkgs"
          [ -n "$pkgs" ] || { echo "::error::nenhum pacote colcon encontrado"; exit 1; }
          colcon build --packages-up-to $pkgs \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # -----------------------------------------------------------------------
      # Testes BLOQUEANTES.
      #
      # Este repositorio e o consumidor final de vision_geometry, stdstates e
      # cv_nodes. E aqui, e so aqui, que um repin que quebre a missao aparece
      # -- o CI de cada biblioteca prova que ELA compila, nao que a missao
      # continua compilando com ela.
      #
      # A grade de varredura e testada porque errar nela nao gera erro: o drone
      # voa bonito e nao passa por cima de uma das bases.
      # -----------------------------------------------------------------------
      - name: Testar
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          pkgs=$(colcon list --names-only --base-paths "src/${{ github.event.repository.name }}" | tr '\n' ' ')
          # Todo teste cujo nome comeca com `test_`, por CONVENCAO e nao por
          # lista.
          #
          # Aqui havia uma lista fixa de nomes, e ela ja falhou tres vezes nesta
          # organizacao: no cv_nodes um pacote inteiro ficou sem teste rodando
          # com o CI verde, e aqui aconteceria de novo com a primeira fase em
          # BT. Uma lista que precisa ser lembrada e uma lista que sera
          # esquecida.
          #
          # `^test_` nao casa com os linters do ament (cpplint, uncrustify,
          # xmllint, lint_cmake, copyright), que e o motivo de o filtro existir:
          # eles reprovam num codigo que nunca teve lint, e liga-los de uma vez
          # produziria uma parede de ruido.
          colcon test --packages-select $pkgs --event-handlers console_direct+ \
            --ctest-args -R '^test_'
          colcon test-result --verbose

  # ---------------------------------------------------------------------------
  # Lint — informativo, não bloqueia.
  #
  # O `colcon test` deste pacote hoje roda apenas os linters do ament
  # (cppcheck, lint_cmake, uncrustify, xmllint); não há teste unitário. Os dois
  # de estilo reprovam num codigo que nunca teve lint. Ligar isso como
  # obrigatorio de uma vez produziria uma parede de ruido e ensinaria o time a
  # ignorar o CI.
  #
  # Fica visivel e nao bloqueante. Quando o estilo for acertado num PR proprio,
  # remova o continue-on-error.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (informativo)
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    continue-on-error: true

    steps:
      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3-vcstool \
            python3-colcon-common-extensions python3-yaml

      - name: Clonar este repositório em src/
        uses: actions/checkout@v4
        with:
          path: src/${{ github.event.repository.name }}

      # Pela API, e não pelo raw.githubusercontent: aquele passa por CDN e serve
      # cópia velha por alguns minutos. Quem acrescenta um pacote ao manifesto e
      # re-roda este CI em seguida recebe o manifesto ANTIGO -- e o sintoma é o
      # pacote novo faltando no `vcs import`, seguido de um erro de rosdep e de
      # um erro de CMake noutro pacote. Aconteceu, e custou uma rodada.
      #
      # A lista impressa abaixo torna isso verificável num relance, em vez de
      # dedutível a partir de três erros que não mencionam o manifesto.
      - name: Buscar o manifesto do workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o evtol.repos \
            -H "Accept: application/vnd.github.raw" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Equipe-eVTOL-ITA/evtol-dev/contents/evtol.repos?ref=main"
          echo "Pacotes no manifesto:"
          python3 -c "import yaml;print(' ', ', '.join(sorted(yaml.safe_load(open('evtol.repos'))['repositories'])))"

      - name: Importar dependências nas versões pinadas
        run: |
          python3 - <<'PY'
          import yaml
          m = yaml.safe_load(open("evtol.repos"))
          m["repositories"].pop("${{ github.event.repository.name }}", None)
          yaml.safe_dump(m, open("deps.repos", "w"))
          PY
          vcs import --shallow src < deps.repos

      - name: rosdep
        run: |
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble || true

      - name: Compilar e rodar linters
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          pkgs=$(colcon list --names-only --base-paths "src/${{ github.event.repository.name }}" | tr '\n' ' ')
          colcon build --packages-up-to $pkgs
          colcon test --packages-select $pkgs
          colcon test-result --verbose
