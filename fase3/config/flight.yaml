# Parametros da missao fase3 — perfil: VOO REAL
#
#   DRONE                                       COMPUTADOR DE SOLO
#     OAK-D (camera_jetson.launch.py)
#       /oak/left/image_rect --> cuVSLAM        [fica no drone]
#                            |
#                            +--> roi_stream
#                                   /gesto_camera/compressed
#                                        --rede-->  gesture_detector
#                                                        |
#                                                     fase3 (FSM)
#              <-------- /fmu/in/trajectory_setpoint -----+
#
#     ros2 topic bw /gesto_camera/compressed

fase3_node:
  ros__parameters:
    # ===== Casa ficticia (FRD: z negativo e para cima) =====
    # [VOO] Ajustar ao ponto de decolagem real.
    fictual_home_x: 0.0
    fictual_home_y: 0.0
    fictual_home_z: -0.6

    # ===== Decolagem =====
    takeoff_height: -1.2
    max_vertical_velocity: 0.7
    position_tolerance: 0.25

    # ===== Pouso =====
    landing_velocity_max: 0.35
    landing_velocity_min: 0.15
    max_base_height: -0.2

    # ===== Abordagem de pouso =====
    # exponencial (padrao)
    # s_curve (sem degrau de aceleracao)
    # px4 (modo LAND do firmware: tira de offboard, DESARMA, ignora as landing_velocity_* acima).
    landing_mode: 'px4'

    # ===== Politica de movimento =====
    # holonomica (padrao) -- linha reta, inclusive de lado.
    # axial               -- gira parado, so entao avanca; nunca de lado.
    # Vale para os estados de navegacao; o alinhamento fino sobre a base
    # continua corrigindo de lado de proposito.
    motion_policy: 'holonomica'

    # ===== Retorno e desarme =====
    return_home_timeout: 30.0
    disarm_grace: 3.0
    disarm_timeout: 20.0

    # ===== Busca da mao =====
    yaw_speed: 0.25
    search_yaw_range: 0.0 # desligado   # 1.0472 # 60 graus
    # Ciclos consecutivos com o gesto antes de aceitar.
    search_confirm_cycles: 5.0

    # ===== Controle por gestos =====
    control_speed: 0.25
    max_horizontal_velocity: 0.6
    detection_timeout: 5.0
    # Ciclos consecutivos para aceitar POUSAR ou VOLTAR PARA CASA.
    command_confirm_cycles: 10.0

    # ===== Rastreio por guinada =====
    # DESLIGADO (0.0). O drone mantem o rumo enquanto obedece aos gestos.
    #
    # LIGADO (1.0), o drone gira para manter a mao em x=0.5
    yaw_tracking: 1.0

    # ===== Rastreio em altura =====
    # DESLIGADO (0.0). A altitude é um SETPOINT DE POSICAO, mantida onde a
    # decolagem deixou
    #
    # LIGADO (1.0), move a REFERENCIA z_ref, nao mandando
    # velocidade. O teto da correcao é max_vertical_velocity.
    climb_tracking: 0.0

    # ===== PID de guinada (so tem efeito com yaw_tracking: 1.0) =====
    yaw_pid_kp: 0.4
    yaw_pid_ki: 0.0
    yaw_pid_kd: 0.08

    # ===== PID de altitude (mantem a mao centrada em y) =====
    climb_pid_kp: 0.6
    climb_pid_ki: 0.0
    climb_pid_kd: 0.12

# ===========================================================================
# No de visao da missao
# ===========================================================================
fase3_gesture:
  ros__parameters:
    gesture_topic: '/gesture_detector/gestures'
    hand_topic: '/gesture_detector/hand_location'

    # Qual mao manda.
    controlling_hand: 0

# ===========================================================================
# Reconhecimento de gestos
# ===========================================================================
gesture_detector:
  ros__parameters:

    #Aqui entra o stream recortado do `roi_stream` (bloco no fim deste arquivo)
    image_topic: '/gesto_camera/compressed'

    num_hands: 2

    # [VOO] Frequencia menor: cada quadro processado e um quadro que teve de
    # atravessar a rede. Meca com `ros2 topic bw` antes de subir este valor.
    # Este filtro age no SOLO, depois da rede. Quem economiza banda e o
    # `publish_rate` do roi_stream, la no drone -- MANTENHA OS DOIS IGUAIS.
    # Com o roi_stream mais rapido que este valor, a diferenca e enlace gasto
    # com quadro que chega para ser descartado; mais lento, o detector fica
    # ocioso esperando quadro.
    processing_frequency: 8.0

    min_hand_detection_confidence: 0.5
    min_hand_presence_confidence: 0.5
    min_tracking_confidence: 0.5

    # Debounce interno do detector, usado na sobreposicao de debug. A decisao
    # que importa -- aceitar um comando -- e da missao, em
    # command_confirm_cycles.
    # Debounce maior: menos quadros por segundo chegando.
    gesture_debounce: 4

    # Debug em taxa baixa.
    debug_image: true
    debug_mask: false
    debug_publish_rate: 2.0
    debug_max_width: 320
    debug_jpeg_quality: 50

# ===========================================================================
# Stream para o solo (recorte + taxa)
# ===========================================================================
# A camera em si NAO se configura aqui. Em voo quem abre o OAK-D e o
# `camera_jetson.launch.py` do slam_bridge, com o
# `slam_bridge/config/camera_params_vslam.yaml` -- porque a MESMA camera
# alimenta o cuVSLAM, e os parametros dela (400P, par retificado, projetor IR
# desligado) sao escolhas do SLAM, nao desta missao. Nao as duplique aqui.
#
# Este bloco configura so o que a missao acrescenta: um no que se INSCREVE no
# par retificado e publica uma versao recortada e mais lenta para o solo.
#
# O roi_stream publica em `<camera_name>_camera/compressed`
#
# O `image_topic` do gesture_detector acima TEM de casar com o que sai daqui.
roi_stream:
  ros__parameters:
    # A ENTRADA e o topico do cuVSLAM.
    input_topic: '/oak/left/image_rect'

    camera_name: 'gesto'

    # ===== Taxa: o maior ganho de banda =====
    # MANTENHA IGUAL ao processing_frequency do gesture_detector acima.
    publish_rate: 8.0

    # ===== ROI =====
    # Recorta 400x400 do centro do quadro 640x400, ou seja, tira as bordas
    # laterais e mantem a altura inteira.
    #
    # roi_x/roi_y = -1 significa CENTRADO.
    roi_width: 400
    roi_height: 400
    roi_x: -1
    roi_y: -1

    # ===== Compressao =====
    jpeg_quality: 50

    # Redimensionamento DEPOIS do recorte, 0 = desligado. Recortar preserva os
    # pixels da mao; reduzir a escala os joga fora, e o MediaPipe perde alcance
    # rapido quando a mao fica pequena. Mexa aqui so se a banda ainda apertar
    # depois de ajustar publish_rate e ROI.
    output_width: 0
    output_height: 0

# O system_health do drone_lib tambem le deste arquivo.
system_health:
  ros__parameters:
    publish_rate: 1.0
