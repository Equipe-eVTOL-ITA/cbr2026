# Parametros da missao fase4 — perfil: simulation
#
# Estes valores sobrescrevem os padroes do codigo. Trocar de simulacao para
# voo real deve ser trocar de arquivo aqui, nunca editar o .cpp.
fase4_node:
  ros__parameters:
    takeoff_height: -1.00

    # ===== Abordagem de decolagem =====
    # stdtakeoff (padrao) -- sobe por setpoint, em OFFBOARD, ate o
    #                        takeoff_height acima.
    # px4                 -- AUTO_TAKEOFF do firmware. Sobe ate o
    #                        MIS_TAKEOFF_ALT do PX4 e IGNORA o takeoff_height;
    #                        sai de offboard, e o estado reentra ao terminar.
    takeoff_mode: 'stdtakeoff'
    max_vertical_velocity: 1.2
    position_tolerance: 0.2

    # Pouso
    landing_velocity_max: 0.5
    landing_velocity_min: 0.15
    # FRD: para cima e NEGATIVO (positivo e aceito, com aviso no log).
    max_base_height: -0.5
    landing_timeout: 5.0

    # ===== Abordagem de pouso =====
    # exponencial (padrao) | s_curve (sem degrau de aceleracao) |
    # px4 (modo LAND do firmware: tira de offboard, DESARMA, ignora as
    # landing_velocity_* acima). Trocar aqui nao exige recompilar.
    landing_mode: 'px4'

    # ===== Politica de movimento =====
    # holonomica (padrao) -- linha reta, inclusive de lado.
    # axial               -- gira parado, so entao avanca; nunca de lado.
    # Vale para os estados de navegacao; o alinhamento fino sobre a base
    # continua corrigindo de lado de proposito.
    motion_policy: 'holonomica'

    # Movimento horizontal
    max_horizontal_velocity: 0.8

    # ── O labirinto ────────────────────────────────────────────────────────
    #
    # A planta e a rota vem deste arquivo, o MESMO que o sim2d le.
    mapa: "cbr2026_fase4.yaml"

    # Onde o drone decola, EM COORDENADAS DO MAPA. Daqui sai o vies inicial da
    # odometria: o Takeoff reancora o referencial, entao a odometria le zero
    # aqui. Comecar com vies zero mandaria o drone para o canto da arena.
    inicio_x: 4.175         # alinhado com a janela de entrada
    inicio_y: -0.600        # do lado de fora
    inicio_yaw: 1.5707963   # apontado para o leste, para dentro

    # ── Geometria das manobras ─────────────────────────────────────────────
    recuo_da_janela: 0.35
    avanco_apos_janela: 0.35
    tolerancia_movimento: 0.08
    tolerancia_centro: 0.06
    yaw_tolerance: 0.05
    ciclos_estaveis: 8.0

    # ── Ajuste de scan (maze_geometry/scan_fit.hpp) ────────────────────────
    #
    # Onde o LIDAR esta em relacao ao centro do drone, ao longo da PROA.
    # POSITIVO e para a frente.
    #
    # 0.053 e o valor do WANDA de acordo com o model.sdf
    # sim2d: 0.0 (o LIDAR esta no centro por construcao)
    lidar_offset_frente: 0.053

    lidar_alcance_max: 8.0
    scan_salto_max: 0.15     # maior que o ruido, menor que a menor quina
    scan_tolerancia: 0.03
    scan_parede_min: 0.20

# O system_health do drone_lib tambem le deste arquivo.
system_health:
  ros__parameters:
    publish_rate: 1.0
